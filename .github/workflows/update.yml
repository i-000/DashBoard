name: Actualizar cartera

on:
  schedule:
    # 05:00 UTC ~ 06:00/07:00 hora de España, de lunes a sabado
    # (asi ya recoge el cierre de EEUU y Europa del dia anterior)
    - cron: "0 5 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar precios
        run: python fetch_prices.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Actualiza datos de cartera $(date -u +'%Y-%m-%d')"
            git push
          fi
